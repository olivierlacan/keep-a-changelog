# Localized copy for the link preview cards (tools/og_images.js renders them
# into source/assets/images/opengraph/<language>/<version>.jpg).
#
# Keyed by the same language codes as $languages in config.rb. English ("en")
# is the fallback: a language absent here gets the English label. To translate
# a language, add its block and keep the %{version} placeholder, which is
# replaced with the version number.
#
# Keep the values plain: the generator reads this file with a minimal parser
# that expects one `key: "value"` line per key.

en:
  version: "Version %{version}"

ar:
  version: "الإصدار %{version}"

cs:
  version: "Verze %{version}"

